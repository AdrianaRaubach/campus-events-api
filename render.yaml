services:
  - type: web
    name: campus-events-api
    runtime: docker
    plan: free
    healthCheckPath: /health/deep
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-events-db
          property: connectionString

databases:
  - name: campus-events-db
    plan: free
    databaseName: campus_events
    user: campus_events
